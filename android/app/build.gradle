plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nous.hermes.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nous.hermes.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The renderer bundle is already compressed; keep the APK build fast.
        noCompress 'png', 'jpg', 'jpeg', 'webp', 'woff', 'woff2', 'ttf', 'otf', 'wasm'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
